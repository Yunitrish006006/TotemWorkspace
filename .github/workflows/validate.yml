name: Validate TotemWorkspace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate coordination snapshot
        run: node scripts/validate-workspace.mjs
      - name: Validate workspace intelligence
        run: node scripts/validate-intelligence.mjs
