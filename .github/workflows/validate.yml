name: Validate TotemWorkspace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.19.4", "22"]
    name: validate (Node ${{ matrix.node-version }})
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate coordination snapshot
        run: node scripts/validate-workspace.mjs
      - name: Validate workspace intelligence
        run: node scripts/validate-intelligence.mjs
      - name: Validate production-code-only inventory
        run: node scripts/validate-code-inventory.mjs
      - name: Validate reviewed code catalog
        run: node scripts/validate-code-catalog.mjs
      - name: Validate Flutter production root
        run: node scripts/validate-flutter-root.mjs
      - name: Validate audited V2 contract endpoints
        run: node scripts/validate-contract-audit.mjs
      - name: Validate two-finger 3D pan
        run: node scripts/validate-3d-pan.mjs
      - name: Validate deterministic 3D module clusters
        run: node scripts/validate-3d-cluster.mjs
      - name: Validate 3D-only feature parity
        run: node scripts/validate-3d-only-parity.mjs
      - name: Validate localhost live viewer
        run: node scripts/validate-local-viewer.mjs
