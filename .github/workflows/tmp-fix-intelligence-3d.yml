name: Fix 3D Validation Assumptions

on:
  push:
    branches:
      - feat/3d-only-parity

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[3d-validator-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/3d-only-parity
          fetch-depth: 0

      - name: Patch legacy V2 validator assumptions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/validate-intelligence.mjs')
          s = p.read_text()
          old = '''    const html = fs.readFileSync(path.join(knowledge.root, "graph-v2.html"), "utf8");
              const renderer = fs.readFileSync(path.join(knowledge.root, "viewer", "graph-v2.js"), "utf8");
              const adapter = fs.readFileSync(path.join(knowledge.root, "viewer", "graph-v2-adapter.js"), "utf8");
              const css = fs.readFileSync(path.join(knowledge.root, "viewer", "graph-v2.css"), "utf8");
              assert.ok(html.includes('src="viewer/generated/graph-data.js"'));
              assert.ok(html.includes('src="viewer/graph-v2.js"'));
              assert.ok(html.includes('href="viewer/graph-v2.css"'));
              assert.ok(html.includes('id="expandAll3d"'));
              assert.ok(!html.includes("window.__TOTEM_GRAPH_DATA__"));
              assert.ok(!html.includes("totem-remnant") && !html.includes("remnant-nexus"));
              assert.ok(!/<script>([\\s\\S]*?)<\\/script>/i.test(html));
              assert.ok(!/<(?:script|link)[^>]+(?:src|href)=["']https?:\\/\\//i.test(html));
              assert.ok(!/@import\\s+["']?https?:\\/\\/|url\\(\\s*["']?https?:\\/\\//i.test(css));
              assert.ok(css.includes("touch-action:none"));
              assert.ok(renderer.includes("function overviewPath"));
              assert.ok(renderer.includes("function draw3d"));
              assert.ok(renderer.includes("function pointerDistance"));
              assert.ok(renderer.includes("spotlightId"));
              assert.ok(renderer.includes("addCapabilityEdges3d"));
              assert.doesNotThrow(() => new Function(renderer));
              assert.doesNotThrow(() => new Function(adapter));'''.replace('              ', '    ')
          new = '''    const html = fs.readFileSync(path.join(knowledge.root, "graph-v2.html"), "utf8");
              const renderer = fs.readFileSync(path.join(knowledge.root, "viewer", "graph-v2-cluster-v2.js"), "utf8");
              const adapter = fs.readFileSync(path.join(knowledge.root, "viewer", "graph-v2-adapter.js"), "utf8");
              const css = fs.readFileSync(path.join(knowledge.root, "viewer", "graph-v2.css"), "utf8");
              assert.ok(html.includes('src="viewer/generated/graph-data.js"'));
              assert.ok(html.includes('src="viewer/graph-v2-cluster-v2.js"'));
              assert.ok(!html.includes('src="viewer/graph-v2.js"'));
              assert.ok(!fs.existsSync(path.join(knowledge.root, "viewer", "graph-v2.js")));
              assert.ok(!html.includes('id="mode2d"') && !html.includes('id="pane2d"') && !html.includes('id="graph2d"'));
              assert.ok(html.includes('href="viewer/graph-v2.css"'));
              assert.ok(html.includes('id="expandAll3d"'));
              assert.ok(!html.includes("window.__TOTEM_GRAPH_DATA__"));
              assert.ok(!html.includes("totem-remnant") && !html.includes("remnant-nexus"));
              assert.ok(!/<script>([\\s\\S]*?)<\\/script>/i.test(html));
              assert.ok(!/<(?:script|link)[^>]+(?:src|href)=["']https?:\\/\\//i.test(html));
              assert.ok(!/@import\\s+["']?https?:\\/\\/|url\\(\\s*["']?https?:\\/\\//i.test(css));
              assert.ok(css.includes("touch-action:none"));
              assert.ok(renderer.includes("function drawArrowhead"));
              assert.ok(renderer.includes("function draw"));
              assert.ok(renderer.includes("function distance"));
              assert.ok(renderer.includes("spotlightId"));
              assert.ok(renderer.includes("function capabilityConsumerEndpoint"));
              assert.ok(renderer.includes("function showContracts"));
              assert.ok(renderer.includes('canvas.addEventListener("keydown"'));
              assert.doesNotThrow(() => new Function(renderer));
              assert.doesNotThrow(() => new Function(adapter));'''.replace('              ', '    ')
          if old not in s:
              raise SystemExit('standalone renderer validation block marker not found')
          p.write_text(s.replace(old, new))

          p = Path('scripts/validate-contract-audit.mjs')
          s = p.read_text()
          old = '''assert.ok(html.includes('src="viewer/generated/graph-data.js"'));
          assert.ok(html.includes('src="viewer/graph-v2-adapter.js"'));
          assert.ok(html.includes('src="viewer/graph-v2.js"'));
          assert.ok(!html.includes("graph-v2-contract-audit.js"));'''.replace('          ', '')
          new = '''assert.ok(html.includes('src="viewer/generated/graph-data.js"'));
          assert.ok(html.includes('src="viewer/graph-v2-adapter.js"'));
          assert.ok(html.includes('src="viewer/graph-v2-cluster-v2.js"'));
          assert.ok(!html.includes('src="viewer/graph-v2.js"'));
          assert.ok(!html.includes('id="mode2d"') && !html.includes('id="pane2d"'));
          assert.ok(!html.includes("graph-v2-contract-audit.js"));'''.replace('          ', '')
          if old not in s:
              raise SystemExit('contract audit renderer assertion marker not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Validate full workspace
        run: |
          node scripts/validate-workspace.mjs
          node scripts/validate-intelligence.mjs
          node scripts/validate-contract-audit.mjs
          node scripts/validate-3d-pan.mjs
          node scripts/validate-3d-cluster.mjs
          node scripts/validate-3d-only-parity.mjs

      - name: Commit validator migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-intelligence.mjs scripts/validate-contract-audit.mjs
          git commit -m "[3d-validator-patch] test: validate standalone 3D renderer"
          git push origin HEAD:feat/3d-only-parity
