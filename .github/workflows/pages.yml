name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TotemWorkspace
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate coordination snapshot
        run: node scripts/validate-workspace.mjs

      - name: Validate localhost live viewer
        run: node scripts/validate-local-viewer.mjs

      - name: Validate Flutter development viewer
        run: node scripts/validate-ai-development-viewer.mjs
      - name: Validate semantic LOD
        run: node scripts/validate-semantic-lod.mjs

      - name: Clone latest active Totem repositories
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > /tmp/totem-modules.tsv
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync("data/modules.json", "utf8"));
          for (const module of data.modules.filter((entry) => entry.active)) {
            process.stdout.write(`${module.name}\t${module.repository}\t${module.defaultBranch}\n`);
          }
          NODE

          while IFS=$'\t' read -r name repository branch; do
            echo "Cloning ${name} (${branch})"
            git clone --depth=1 --single-branch --branch "$branch" "$repository" "../$name"
          done < /tmp/totem-modules.tsv

      - name: Build latest code index and Flutter graph data
        env:
          TOTEM_WORKSPACE_ROOT: ${{ github.workspace }}
          TOTEM_REPOS_ROOT: ${{ github.workspace }}/..
        run: |
          node scripts/totem-intelligence.mjs build-index
          node scripts/render-flutter-graph.mjs

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: viewer_flutter
        run: flutter pub get

      - name: Build Flutter production root (Wasm)
        working-directory: viewer_flutter
        run: flutter build web --wasm --base-href /TotemWorkspace/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site

          # Flutter is the only production viewer surface.
          cp -R viewer_flutter/build/web/. _site/

          # Keep the curated source available for architecture inspection.
          cp index.html _site/curated.html
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
