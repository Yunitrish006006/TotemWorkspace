name: Apply 3D Only Parity

on:
  push:
    branches:
      - feat/3d-only-parity

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[3d-only-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/3d-only-parity
          fetch-depth: 0

      - name: Apply 3D-only parity migration
        run: node scripts/apply-3d-only-parity.mjs

      - name: Repair generated parity validator quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/validate-3d-only-parity.mjs')
          s = p.read_text()
          s = s.replace('source.includes("document.getElementById("snapshot").textContent")', 'source.includes(\'document.getElementById("snapshot").textContent\')')
          s = s.replace('source.includes("document.getElementById("stats").textContent")', 'source.includes(\'document.getElementById("stats").textContent\')')
          p.write_text(s)
          PY

      - name: Validate patched site
        run: |
          node --check viewer/graph-v2-cluster-v2.js
          node scripts/validate-3d-pan.mjs
          node scripts/validate-3d-cluster.mjs
          node scripts/validate-3d-only-parity.mjs

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git restore -- .github/workflows/pages.yml .github/workflows/validate.yml
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[3d-only-patch] feat: complete 3D parity and remove 2D"
          git push origin HEAD:feat/3d-only-parity
