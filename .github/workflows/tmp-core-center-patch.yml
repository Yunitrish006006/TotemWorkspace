name: Apply Core Center Patch

on:
  push:
    branches:
      - feat/desktop-right-drag-pan-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[core-center-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/desktop-right-drag-pan-v2
          fetch-depth: 0

      - name: Apply Core-center patch
        run: node scripts/apply-core-center-patch.mjs

      - name: Validate patched renderer
        run: |
          node --check viewer/graph-v2-cluster-v2.js
          node scripts/validate-3d-pan.mjs
          node scripts/validate-3d-cluster.mjs

      - name: Commit patched renderer
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/graph-v2-cluster-v2.js scripts/validate-3d-cluster.mjs
          git commit -m "[core-center-patch] feat: anchor Core at 3D world center"
          git push origin HEAD:feat/desktop-right-drag-pan-v2
