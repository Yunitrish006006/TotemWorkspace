name: Register TotemObserver

on:
  push:
    branches: ["feat/register-totem-observer"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out workspace
        uses: actions/checkout@v4
        with:
          ref: feat/register-totem-observer
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Register TotemObserver ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          modules_path = Path('data/modules.json')
          data = json.loads(modules_path.read_text())
          data['snapshot']['date'] = '2026-09-11'

          by_id = {m['id']: m for m in data['modules']}

          core = by_id['totem-core']
          core['version'] = '0.7.19'
          core['commit'] = '21217505fa1d1100a00336d657f07fdd3505868b'
          core['role'] = '共用 API、事件、手冊、好友、遷移、Observer provider 與世界輪廓契約。'

          vanilla = by_id['totem-vanilla-tweaks']
          vanilla['version'] = '0.1.28'
          vanilla['commit'] = '0360c3f513fe1247f1c4fd96c7d3af7e22365803'
          vanilla['coreDependency'] = '>=0.7.18 <0.8.0'
          vanilla['role'] = '原版向玩法修正：容器整理、講台／書櫃、混凝土、熔爐／漏斗經驗與骷髏玩法調整。'
          vanilla['featureGroups'] = ['容器整理', '講台與書櫃', '混凝土粉末', '熔爐與漏斗經驗', '骷髏彈藥與難度縮放']
          vanilla['runtimeOptionalIntegrationIds'] = []
          vanilla['observerProviders'] = []

          observer = {
              'id': 'totem-observer',
              'name': 'TotemObserver',
              'active': True,
              'version': '0.1.0',
              'defaultBranch': 'main',
              'commit': '51e1507564de9a58016977b16798ec1dd143a41d',
              'repository': 'https://github.com/Yunitrish006006/TotemObserver',
              'coreDependency': '>=0.7.18 <0.8.0',
              'role': '伺服器授權的 Spectator Observer View runtime；負責 session、camera、語意 relay、vanilla Screen adapters、provider negotiation、privacy/redaction 與 3-JVM E2E。',
              'featureGroups': ['Observer View runtime', '/observeui 與 session lifecycle', 'Spectator camera', '語意 HUD／Screen relay', 'Vanilla Screen adapters', 'Provider negotiation 與隱私邊界'],
              'declaredSuggests': [],
              'runtimeOptionalIntegrationIds': ['observer-automata', 'observer-nexus', 'observer-remnant', 'observer-locksmith', 'observer-villagers'],
              'observerProviders': []
          }
          by_id['totem-observer'] = observer
          data['modules'] = sorted(by_id.values(), key=lambda m: m['id'])

          dep = data.setdefault('dependencyAudit', {})
          runtime = dep.setdefault('runtimeOptional', [])
          runtime = [item for item in runtime if not (item.get('from') == 'totem-vanilla-tweaks' and 'observer' in item.get('id', ''))]
          targets = {
              'observer-automata': ('totem-automata', 'Automata-owned Copper Golem Screen provider'),
              'observer-nexus': ('totem-nexus', 'Nexus-owned Screen providers'),
              'observer-remnant': ('totem-remnant', 'Remnant-owned backpack Screen provider'),
              'observer-locksmith': ('totem-locksmith', 'Locksmith-owned management Screen provider'),
              'observer-villagers': ('totem-villagers', 'Villagers-owned Woodcutter Screen provider'),
          }
          existing = {item.get('id') for item in runtime}
          for rid, (target, feature) in targets.items():
              if rid not in existing:
                  runtime.append({
                      'id': rid,
                      'from': 'totem-observer',
                      'to': target,
                      'kind': 'observer-provider',
                      'feature': f'{feature} 透過 TotemCore ObserverScreenProvider 契約被 TotemObserver 動態發現與 relay。',
                      'fallback': 'provider 不存在或 family/protocol 未協商成功時只顯示 unsupported metadata，不合成鏡像 Screen。'
                  })
          dep['runtimeOptional'] = runtime
          modules_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          audit_path = Path('data/relationship-audit.json')
          audit = json.loads(audit_path.read_text())
          audit['auditedAt'] = '2026-09-11'
          overrides = audit.setdefault('contractOverrides', {})
          for key, value in list(overrides.items()):
              if key.startswith('vanilla-') and key.endswith('-observer'):
                  value['featureIds'] = [
                      'totem-observer.feature-1' if fid == 'totem-vanilla-tweaks.feature-1' else fid
                      for fid in value.get('featureIds', [])
                  ]
                  value['from'] = 'totem-observer'
                  value['source'] = 'TotemObserver'
                  value['auditNote'] = (value.get('auditNote', '') + ' Observer session/transport ownership moved from TotemVanillaTweaks to TotemObserver; the legacy contract id is retained for curated-snapshot compatibility, while the owning module still owns its production Screen provider.').strip()
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n')

          matrix_path = Path('data/test-matrix.json')
          matrix = json.loads(matrix_path.read_text())
          matrix['modules']['totem-vanilla-tweaks'] = {
              'validation': ['gametest', 'client-runtime-check'],
              'notes': 'Gameplay-only module: verify container, bookshelf/lectern, concrete, XP and skeleton behavior; Observer runtime coverage belongs to TotemObserver.'
          }
          matrix['modules']['totem-observer'] = {
              'validation': ['unit-tests', 'client-gametest', 'observer-provider-compat', 'input-packet-suppression', 'privacy-redaction', 'close-cleanup', 'three-jvm-e2e', 'production-runtime-probe', 'cross-module-build'],
              'notes': 'Observer owns session/camera/semantic transport/vanilla adapters. Feature modules own their Screen providers; provider absence must fall back to metadata without framebuffer capture.'
          }
          matrix_path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + '\n')

          knowledge_path = Path('intelligence/workspace-knowledge.mjs')
          knowledge = knowledge_path.read_text()
          if 'observer: "totem-observer"' not in knowledge:
              knowledge = knowledge.replace(
                  '  nexus: "totem-nexus",\n  remnant: "totem-remnant"',
                  '  nexus: "totem-nexus",\n  observer: "totem-observer",\n  remnant: "totem-remnant"'
              )
          knowledge = knowledge.replace('        from: "totem-vanilla-tweaks",\n        to: module.id,\n        providerOwner: module.id,', '        from: "totem-observer",\n        to: module.id,\n        providerOwner: module.id,')
          fallback_marker = '  return Object.freeze(features);\n}\n\nfunction buildContractRecords'
          if 'coveredOwnerIds' not in knowledge:
              fallback = '''  const coveredOwnerIds = new Set(features.map((feature) => feature.ownerId));
  for (const module of modules) {
    if (coveredOwnerIds.has(module.id)) continue;
    const ownerKey = ID_TO_MODULE_KEY[module.id] ?? module.id;
    for (const [index, summary] of (module.featureGroups ?? []).entries()) {
      features.push(Object.freeze({
        id: `${module.id}.feature-${index + 1}`,
        ownerId: module.id,
        ownerKey,
        index: index + 1,
        title: String(summary).split("：", 1)[0].trim() || `feature-${index + 1}`,
        summary: String(summary),
        softContractIds: Object.freeze([]),
        serviceContractIds: Object.freeze([]),
        eventContractIds: Object.freeze([])
      }));
    }
  }
  return Object.freeze(features);
}

function buildContractRecords'''
              if fallback_marker not in knowledge:
                  raise SystemExit('workspace-knowledge feature fallback anchor missing')
              knowledge = knowledge.replace(fallback_marker, fallback)
          knowledge_path.write_text(knowledge)

          catalog_path = Path('docs/module-catalog.md')
          text = catalog_path.read_text()
          text = re.sub(r'此表以 \d{4}-\d{2}-\d{2} 的 \d+ 個現役 repository 原始碼為準。', '此表以 2026-09-11 的 12 個現役 repository 原始碼為準。', text)
          text = re.sub(r'^\| TotemCore \|.*$', '| TotemCore | 0.7.19 | `master` | `2121750` | [GitHub](https://github.com/Yunitrish006006/TotemCore) | 共用 API、事件、手冊、好友、Observer provider 與世界輪廓契約 |', text, flags=re.M)
          text = re.sub(r'^\| TotemVanillaTweaks \|.*$', '| TotemVanillaTweaks | 0.1.28 | `main` | `0360c3f` | [GitHub](https://github.com/Yunitrish006006/TotemVanillaTweaks) | 原版向 gameplay tweaks；Observer runtime 已移至 TotemObserver |', text, flags=re.M)
          if '| TotemObserver |' not in text:
              marker = '| TotemRemnant |'
              row = '| TotemObserver | 0.1.0 | `main` | `51e1507` | [GitHub](https://github.com/Yunitrish006006/TotemObserver) | Spectator Observer View session、camera、語意 relay、vanilla adapters 與 E2E |\n'
              text = text.replace(marker, row + marker)
          text = re.sub(r'^- \*\*TotemVanillaTweaks\*\*：.*$', '- **TotemVanillaTweaks**：容器整理、書櫃／講台、混凝土、熔爐／漏斗經驗與骷髏玩法調整；不再擁有 Observer runtime。', text, flags=re.M)
          if '- **TotemObserver**：' not in text:
              marker = '- **TotemRemnant**：'
              bullet = '- **TotemObserver**：`/observeui`、伺服器授權 session、Spectator camera、語意 HUD／Screen relay、vanilla Screen adapters、generic provider negotiation、privacy/redaction 與 3-JVM E2E。\n'
              text = text.replace(marker, bullet + marker)
          catalog_path.write_text(text)

          history = Path('docs/history/2026-09-11-observer-extraction.md')
          history.write_text('''# Observer subsystem extraction\n\nOn 2026-09-11, Observer View ownership was moved out of TotemVanillaTweaks into the dedicated TotemObserver module.\n\n- TotemCore owns the versioned Observer provider/contracts only.\n- TotemObserver owns `/observeui`, server-authoritative sessions, Spectator camera orchestration, semantic transport, vanilla Screen adapters, privacy/redaction, fallback metadata, cross-module runtime validation and the Dedicated Server + Target Client + Observer Client E2E.\n- Feature modules own capture/reconstruction for their production Screens through `ObserverScreenProvider`.\n- TotemVanillaTweaks 0.1.28 is gameplay-only and no longer contains Observer runtime code.\n- TotemObserver 0.1.0 intentionally breaks TotemVanillaTweaks <=0.1.27 to prevent duplicate Observer runtime registration during the migration.\n\nThe provider negotiation path is module-agnostic: adding a new module-owned Observer Screen should require the owning module to add its provider, without adding a family-specific switch or capability bit to TotemObserver.\n''')
          PY
      - name: Render Flutter graph data
        run: node scripts/render-flutter-graph.mjs
      - name: Validate workspace snapshot
        run: |
          set -euo pipefail
          node scripts/validate-workspace.mjs
          node scripts/validate-intelligence.mjs
          node scripts/validate-contract-audit.mjs
          node scripts/validate-code-inventory.mjs
          node scripts/validate-gamerule-event-inventory.mjs
          node scripts/validate-core-api-capabilities.mjs
          node scripts/validate-flutter-root.mjs
          node scripts/validate-local-viewer.mjs
          node scripts/validate-ai-development-viewer.mjs
          node scripts/validate-semantic-lod.mjs
          node scripts/validate-change-intelligence.mjs
          node scripts/validate-verification-graph.mjs
          node scripts/validate-agent-adapter.mjs
          node scripts/validate-development-replay.mjs
          node scripts/validate-adaptive-orchestration.mjs
          node scripts/validate-remote-bridge.mjs
          git diff --check
      - name: Commit migration output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs intelligence viewer_flutter/assets/graph-data.json
          git diff --cached --quiet && exit 0
          git commit -m 'docs: register TotemObserver ownership'
          git push origin HEAD:feat/register-totem-observer
