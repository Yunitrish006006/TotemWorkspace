name: Register TotemObserver

on:
  push:
    branches: ["feat/register-totem-observer"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out workspace
        uses: actions/checkout@v4
        with:
          ref: feat/register-totem-observer
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Register TotemObserver ownership
        run: python3 .github/register-totem-observer.py
      - name: Render Flutter graph data
        run: node scripts/render-flutter-graph.mjs
      - name: Validate workspace snapshot
        run: |
          set -euo pipefail
          node scripts/validate-workspace.mjs
          node scripts/validate-intelligence.mjs
          node scripts/validate-contract-audit.mjs
          node scripts/validate-code-inventory.mjs
          node scripts/validate-gamerule-event-inventory.mjs
          node scripts/validate-core-api-capabilities.mjs
          node scripts/validate-flutter-root.mjs
          node scripts/validate-local-viewer.mjs
          node scripts/validate-ai-development-viewer.mjs
          node scripts/validate-semantic-lod.mjs
          node scripts/validate-change-intelligence.mjs
          node scripts/validate-verification-graph.mjs
          node scripts/validate-agent-adapter.mjs
          node scripts/validate-development-replay.mjs
          node scripts/validate-adaptive-orchestration.mjs
          node scripts/validate-remote-bridge.mjs
          git diff --check
      - name: Commit migration output
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs intelligence viewer_flutter/assets/graph-data.json
          git diff --cached --quiet && exit 0
          git commit -m 'docs: register TotemObserver ownership'
          git push origin HEAD:feat/register-totem-observer
