name: Apply Edge Filter Cleanup

on:
  push:
    branches:
      - feat/relation-aware-cluster-layout-filter-final-stage

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stage branch
        uses: actions/checkout@v4
        with:
          ref: feat/relation-aware-cluster-layout-filter-final-stage
          fetch-depth: 0

      - name: Apply edge filter cleanup
        run: python scripts/apply-edge-filter-cleanup.py

      - name: Validate renderer and workspace
        run: |
          node --check viewer/graph-v2-cluster-v2.js
          node scripts/validate-workspace.mjs
          node scripts/validate-intelligence.mjs
          node scripts/validate-contract-audit.mjs
          node scripts/validate-3d-pan.mjs
          node scripts/validate-3d-cluster.mjs
          node scripts/validate-3d-only-parity.mjs

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graph-v2.html viewer/graph-v2.css viewer/graph-v2-cluster-v2.js scripts/validate-3d-cluster.mjs
          git commit -m "feat: add edge filters and remove expanded center spokes"
          git push origin HEAD:feat/relation-aware-cluster-layout-filter-final-stage
