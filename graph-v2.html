<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
<title>TOTEM Architecture V2</title>
<link rel="stylesheet" href="viewer/graph-v2.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <b>TOTEM Architecture V2</b>
      <small>renderer shell · architecture data is loaded separately</small>
    </div>
    <span class="pill" id="snapshot">loading</span>
    <span class="pill" id="stats">loading</span>
    <button id="overview" type="button">總覽</button>
    <button id="expandAll3d" type="button">3D 全展開</button>
    <button id="contracts" type="button">關係</button>
    <button id="mode2d" type="button" aria-pressed="true">2D 分層</button>
    <button id="mode3d" type="button" aria-pressed="false">3D 預覽</button>
  </header>
  <main class="stage">
    <section id="pane2d" class="pane">
      <div class="svg-wrap"><svg id="graph2d" role="img" aria-label="TOTEM V2 分層架構圖"></svg></div>
    </section>
    <section id="pane3d" class="pane" hidden>
      <canvas id="graph3d" class="canvas3d" aria-label="TOTEM 3D 架構預覽"></canvas>
      <div class="hint3d">一指拖曳旋轉｜兩指縮放＋平移觀看位置｜點子節點聚光相關連線｜3D 只讀 view model</div>
    </section>
    <aside id="info" class="info" hidden>
      <h2 id="infoTitle"></h2>
      <p id="infoBody"></p>
      <div id="infoContent"></div>
    </aside>
    <div class="legend">
      <span><i class="dot hard"></i>Hard dependency</span>
      <span><i class="dot suggest"></i>Fabric suggests</span>
      <span><i class="dot compat"></i>Runtime / Observer / EventBus</span>
      <span><i class="dot service"></i>External service</span>
      <span><i class="dot capability"></i>Shared Core capability</span>
      <span><i class="dot generated"></i>Generated code detail</span>
    </div>
  </main>
</div>
<script src="viewer/generated/graph-data.js"></script>
<script src="viewer/graph-v2-adapter.js"></script>
<script src="viewer/graph-v2.js"></script>
<script src="viewer/graph-v2-pan.js"></script>
</body>
</html>
