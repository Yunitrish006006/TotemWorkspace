<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>TOTEM Architecture V2</title>
<style>
:root{color-scheme:dark;--bg:#050c16;--panel:#0b1625;--panel2:#101f33;--ink:#edf6ff;--muted:#8fa5bd;--hard:#60a5fa;--opt:#fbbf24;--compat:#a78bfa;--service:#22d3ee;--code:#34d399;--test:#fb7185}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:radial-gradient(circle at 40% 20%,#102840 0,#07111e 36%,var(--bg) 75%);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr}.bar{z-index:4;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #26394f;background:rgba(6,15,27,.96);box-shadow:0 8px 30px #0007}.brand{margin-right:auto}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);margin-top:2px}.pill{padding:5px 9px;border:1px solid #38506a;border-radius:999px;color:#bdd0e5;font-size:12px;background:#0e2033}button{border:1px solid #38506a;border-radius:8px;background:#14263b;color:var(--ink);padding:7px 11px;font-weight:700;cursor:pointer}button:hover{background:#1c3550}button[aria-pressed="true"]{border-color:#7dd3fc;background:#164e63}.stage{position:relative;min-height:0}.pane{position:absolute;inset:0}.pane[hidden]{display:none}.svg-wrap{width:100%;height:100%;overflow:auto}.svg-wrap svg{display:block;min-width:100%;min-height:100%}.node{cursor:pointer}.node rect{fill:#10233a;stroke:#47647f;stroke-width:2}.node:hover rect,.node.selected rect{stroke:#fff;filter:drop-shadow(0 0 10px #ffffff66)}.node.module rect{fill:#112a43;stroke:#6aa6d9}.node.core rect{fill:#083344;stroke:#22d3ee;stroke-width:3}.node.external rect{fill:#3b2b16;stroke:#fbbf24}.node.feature rect{fill:#18243a;stroke:#7c93b2}.node.category rect{fill:#0e332b;stroke:#34d399}.node.file rect{fill:#10283b;stroke:#4b718e}.node.test rect{fill:#321c2b;stroke:#fb7185}.node.symbol rect{fill:#172033;stroke:#64748b}.label{fill:#f8fafc;font-size:15px;font-weight:800}.sub{fill:#9db1c6;font-size:11px}.edge{fill:none;stroke-width:2.4;opacity:.8}.edge.hard{stroke:var(--hard)}.edge.fabric-suggests{stroke:var(--opt)}.edge.runtime-optional,.edge.observer-provider,.edge.eventbus{stroke:var(--compat);stroke-dasharray:8 6}.edge.external-service{stroke:var(--service)}.edge.detail{stroke:#47647f;stroke-width:1.7}.edge.back{opacity:.5}.legend{position:absolute;left:12px;bottom:12px;z-index:2;display:flex;gap:8px;flex-wrap:wrap;max-width:min(900px,calc(100% - 24px));padding:7px 9px;border:1px solid #26394f;border-radius:10px;background:#071421e8;font-size:11px;color:#a8bdd2}.dot{display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:middle}.info{position:absolute;right:14px;top:14px;z-index:3;width:min(390px,calc(100% - 28px));max-height:calc(100% - 28px);overflow:auto;padding:13px;border:1px solid #2d435c;border-radius:12px;background:#081523ed;box-shadow:0 16px 38px #0008}.info[hidden]{display:none}.info h2{font-size:17px;margin:0 0 5px}.info p{color:#b8c9da;line-height:1.5;font-size:13px}.info ul{margin:8px 0 0;padding-left:18px;color:#a8bdd2;font-size:12px}.canvas3d{width:100%;height:100%;display:block;cursor:grab}.canvas3d.dragging{cursor:grabbing}.hint3d{position:absolute;left:12px;top:12px;padding:7px 10px;border-radius:9px;background:#06111ecf;border:1px solid #2b4057;color:#a9bdd0;font-size:12px;pointer-events:none}.empty{display:grid;place-items:center;height:100%;color:#92a7bd;text-align:center;padding:40px}@media(max-width:800px){.brand{width:100%}.info{top:auto;bottom:12px;max-height:42%}.pill{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="bar">
  <div class="brand"><b>TOTEM Architecture V2</b><small id="subtitle">graph-first architecture + generated code detail</small></div>
  <span class="pill" id="snapshot"></span><span class="pill" id="stats"></span>
  <button id="overview" type="button">總覽</button>
  <button id="mode2d" type="button" aria-pressed="true">2D 分層</button>
  <button id="mode3d" type="button" aria-pressed="false">3D 預覽</button>
</header>
<main class="stage">
  <section id="pane2d" class="pane"><div id="svgWrap" class="svg-wrap"><svg id="graph2d" role="img" aria-label="TOTEM V2 分層架構圖"></svg></div></section>
  <section id="pane3d" class="pane" hidden><canvas id="graph3d" class="canvas3d" aria-label="TOTEM 3D 架構預覽"></canvas><div class="hint3d">拖曳旋轉｜滾輪縮放｜3D 僅是展示層，不參與 MCP/RAG/驗證</div></section>
  <aside id="info" class="info" hidden><h2 id="infoTitle"></h2><p id="infoBody"></p><ul id="infoList"></ul></aside>
  <div class="legend"><span><i class="dot" style="background:#60a5fa"></i>Core 硬依賴</span><span><i class="dot" style="background:#fbbf24"></i>Fabric suggests</span><span><i class="dot" style="background:#a78bfa"></i>Runtime / Observer / EventBus（回向線走 rail）</span><span><i class="dot" style="background:#22d3ee"></i>外部服務</span><span><i class="dot" style="background:#34d399"></i>自動產生 code detail</span></div>
</main>
</div>
<script>
(function(){"use strict";
var DATA=__TOTEM_GRAPH_DATA__;
var NS="http://www.w3.org/2000/svg",selected=null,mode="2d";
var svg=document.getElementById("graph2d"),pane2d=document.getElementById("pane2d"),pane3d=document.getElementById("pane3d"),canvas=document.getElementById("graph3d"),info=document.getElementById("info");
var moduleMap=new Map(DATA.modules.map(function(x){return[x.id,x]}));
var externalMap=new Map((DATA.externalNodes||[]).map(function(x){return[x.id,x]}));
document.getElementById("snapshot").textContent=(DATA.snapshot&&DATA.snapshot.date?DATA.snapshot.date:"unknown")+" snapshot";
document.getElementById("stats").textContent=DATA.modules.length+" modules｜"+DATA.features.length+" features｜"+DATA.contracts.length+" contracts｜"+(DATA.code&&DATA.code.nodes?DATA.code.nodes.length:0)+" code nodes";
function el(name,attrs){var n=document.createElementNS(NS,name);Object.keys(attrs||{}).forEach(function(k){n.setAttribute(k,String(attrs[k]));});return n}

function nodeGroup(item,p,kind,onClick){var g=el("g",{"class":"node "+kind,transform:"translate("+p.x+" "+p.y+")",tabindex:"0",role:"button"});var w=p.w||240,h=p.h||70;g.appendChild(el("rect",{width:w,height:h,rx:12}));var t=el("text",{x:15,y:28,"class":"label"});t.textContent=short(item.name||item.label||item.title||item.id,30);g.appendChild(t);var s=el("text",{x:15,y:49,"class":"sub"});s.textContent=short(item.version||item.path||item.role||item.type||"",42);g.appendChild(s);g.addEventListener("click",onClick);g.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();onClick()}});return g}
function contractEndpoints(c){var from=c.from,to=c.to;if(!from||!to)return null;return[from,to]}
function layoutOverview(){var ranks=new Map(),all=[];DATA.modules.forEach(function(m){var r=m.rankHint||1;if(!ranks.has(r))ranks.set(r,[]);ranks.get(r).push(m);all.push(m)});(DATA.externalNodes||[]).forEach(function(m){var r=4;if(!ranks.has(r))ranks.set(r,[]);ranks.get(r).push(m);all.push(m)});var pos=new Map(),xs={1:90,2:520,3:980,4:1360},maxRows=1;ranks.forEach(function(list,rank){list.sort(function(a,b){return(a.name||a.id).localeCompare(b.name||b.id)});maxRows=Math.max(maxRows,list.length);var gap=112,start=90;list.forEach(function(m,i){pos.set(m.id,{x:xs[rank]||90,y:start+i*gap,w:300,h:76})})});return{pos:pos,width:1700,height:Math.max(900,180+maxRows*112)}}
function monotonicPath(a,b,type){var ax=a.x+a.w,ay=a.y+a.h/2,bx=b.x,by=b.y+b.h/2;if(bx>=ax){var mid=ax+(bx-ax)*.5;return"M"+ax+" "+ay+" C"+mid+" "+ay+" "+mid+" "+by+" "+bx+" "+by}var rail=(type==="eventbus"?30:Math.max(30,Math.min(ay,by)-62));return"M"+ax+" "+ay+" C"+(ax+70)+" "+ay+" "+(ax+70)+" "+rail+" "+(ax+20)+" "+rail+" L"+(bx-20)+" "+rail+" C"+(bx-70)+" "+rail+" "+(bx-70)+" "+by+" "+bx+" "+by}
function renderOverview(){selected=null;clear();info.hidden=true;var L=layoutOverview();svg.setAttribute("viewBox","0 0 "+L.width+" "+L.height);svg.setAttribute("width",L.width);svg.setAttribute("height",L.height);var defs=el("defs");["hard","fabric-suggests","runtime-optional","observer-provider","eventbus","external-service"].forEach(function(k){var m=el("marker",{id:"arr-"+k,markerWidth:8,markerHeight:8,refX:7,refY:4,orient:"auto"});var p=el("path",{d:"M0 0L8 4 0 8Z",fill:k==="hard"?"#60a5fa":k==="fabric-suggests"?"#fbbf24":k==="external-service"?"#22d3ee":"#a78bfa"});m.appendChild(p);defs.appendChild(m)});svg.appendChild(defs);var eg=el("g");DATA.contracts.forEach(function(c){var ep=contractEndpoints(c);if(!ep)return;var a=L.pos.get(ep[0]),b=L.pos.get(ep[1]);if(!a||!b)return;var path=el("path",{d:monotonicPath(a,b,c.type),"class":edgeClass(c.type)+(b.x<a.x?" back":""),"marker-end":"url(#arr-"+c.type+")"});eg.appendChild(path)});svg.appendChild(eg);var ng=el("g");DATA.modules.concat(DATA.externalNodes||[]).forEach(function(m){var p=L.pos.get(m.id);if(!p)return;var kind=m.id==="totem-core"?"module core":moduleMap.has(m.id)?"module":"external";ng.appendChild(nodeGroup(m,p,kind,function(){if(moduleMap.has(m.id))renderModule(m.id);else showInfo(m.name||m.id,"外部節點",[])}))});svg.appendChild(ng);draw3d()}
function renderModule(moduleId){selected=moduleId;clear();var mod=moduleMap.get(moduleId);if(!mod)return;var feats=DATA.features.filter(function(f){return f.ownerId===moduleId});var codeNodes=(DATA.code&&DATA.code.nodes)||[],codeEdges=(DATA.code&&DATA.code.edges)||[];var cats=codeNodes.filter(function(n){return n.moduleId===moduleId&&n.type==="code-category"});var files=codeNodes.filter(function(n){return n.moduleId===moduleId&&(n.type==="code-file"||n.type==="test-file")});var symbols=codeNodes.filter(function(n){return n.moduleId===moduleId&&n.type==="code-symbol"});var height=Math.max(900,150+Math.max(feats.length*86,files.length*64));svg.setAttribute("viewBox","0 0 1760 "+height);svg.setAttribute("width",1760);svg.setAttribute("height",height);var positions=new Map();positions.set(moduleId,{x:50,y:70,w:280,h:82});var fg=el("g"),eg=el("g");var featureTitle={id:"feature-root",name:"Curated features",version:feats.length+" branches"};positions.set(featureTitle.id,{x:390,y:40,w:260,h:68});fg.appendChild(nodeGroup(mod,positions.get(moduleId),"module "+(moduleId==="totem-core"?"core":""),function(){showInfo(mod.name,mod.role,mod.featureGroups||[])}));fg.appendChild(nodeGroup(featureTitle,positions.get(featureTitle.id),"category",function(){}));eg.appendChild(el("path",{d:"M330 111 L390 74","class":"edge detail"}));feats.forEach(function(f,i){var p={x:390,y:125+i*82,w:360,h:66};positions.set(f.id,p);fg.appendChild(nodeGroup({name:f.title,version:"curated feature"},p,"feature",function(){showInfo(mod.name+"｜"+f.title,f.summary,[].concat(f.softContractIds||[],f.serviceContractIds||[],f.eventContractIds||[]))}));eg.appendChild(el("path",{d:"M520 108 L520 "+p.y+" L"+p.x+" "+(p.y+33),"class":"edge detail"}))});var catY=40;cats.forEach(function(c){var p={x:820,y:catY,w:250,h:64};positions.set(c.id,p);fg.appendChild(nodeGroup({name:c.label,version:c.count+" files"},p,"category",function(){}));eg.appendChild(el("path",{d:"M330 111 C570 111 580 "+(p.y+32)+" "+p.x+" "+(p.y+32),"class":"edge detail"}));var cf=files.filter(function(f){return f.category===c.category});cf.forEach(function(f,j){var fp={x:1110,y:catY+j*64,w:300,h:56};positions.set(f.id,fp);fg.appendChild(nodeGroup({name:f.label,version:f.path},fp,f.type==="test-file"?"test":"file",function(){showInfo(f.label,f.path,["category: "+f.category,"symbols: "+f.symbolCount])}));eg.appendChild(el("path",{d:"M"+(p.x+p.w)+" "+(p.y+32)+" C1090 "+(p.y+32)+" 1090 "+(fp.y+28)+" "+fp.x+" "+(fp.y+28),"class":"edge detail"}));var sf=symbols.filter(function(s){return s.path===f.path});sf.forEach(function(s,k){var sp={x:1450,y:fp.y+k*43,w:250,h:36};positions.set(s.id,sp);var g=nodeGroup({name:s.label,version:"symbol"},sp,"symbol",function(){showInfo(s.label,s.path,[])});fg.appendChild(g);eg.appendChild(el("path",{d:"M"+(fp.x+fp.w)+" "+(fp.y+28)+" L"+sp.x+" "+(sp.y+18),"class":"edge detail"}))})});catY+=Math.max(86,cf.length*64+30)});svg.appendChild(eg);svg.appendChild(fg);var contracts=DATA.contracts.filter(function(c){return c.from===moduleId||c.to===moduleId||(c.relatedNodes||[]).includes(moduleId)});showInfo(mod.name+" "+mod.version,mod.role,["點『總覽』返回模組圖","功能："+feats.length,"Code categories："+cats.length,"可視化檔案："+files.length,"相關 contracts："+contracts.length]);draw3d()}
document.getElementById("overview").addEventListener("click",renderOverview);
document.getElementById("mode2d").addEventListener("click",function(){mode="2d";pane2d.hidden=false;pane3d.hidden=true;this.setAttribute("aria-pressed","true");document.getElementById("mode3d").setAttribute("aria-pressed","false")});
document.getElementById("mode3d").addEventListener("click",function(){mode="3d";pane2d.hidden=true;pane3d.hidden=false;this.setAttribute("aria-pressed","true");document.getElementById("mode2d").setAttribute("aria-pressed","false");resize3d();draw3d()});
var cam={yaw:-.45,pitch:.22,zoom:1.05},drag=null;
function resize3d(){var d=devicePixelRatio||1,r=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d))}
function project(p,w,h){var cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);var x=p.x*cy-p.z*sy,z=p.x*sy+p.z*cy,y=p.y*cp-z*sp;z=p.y*sp+z*cp;var depth=900+z,scale=cam.zoom*800/Math.max(180,depth);return{x:w/2+x*scale,y:h/2+y*scale,scale:scale,z:z}}
function scene3d(){var nodes=[],edges=[];var mods=DATA.modules.concat(DATA.externalNodes||[]);mods.forEach(function(m,i){var rank=m.rankHint||4;var same=mods.filter(function(x){return(x.rankHint||4)===rank});var idx=same.indexOf(m);nodes.push({id:m.id,label:m.name||m.id,type:moduleMap.has(m.id)?"module":"external",x:(rank-2.5)*290,y:(idx-(same.length-1)/2)*125,z:0})});DATA.contracts.forEach(function(c){if(c.from&&c.to)edges.push({from:c.from,to:c.to,type:c.type})});if(selected&&DATA.code){var cats=DATA.code.nodes.filter(function(n){return n.moduleId===selected&&n.type==="code-category"});cats.forEach(function(c,i){nodes.push({id:c.id,label:c.label,type:"category",x:520,y:(i-(cats.length-1)/2)*95,z:180});edges.push({from:selected,to:c.id,type:"detail"})})}return{nodes:nodes,edges:edges}}
function draw3d(){if(mode!=="3d")return;resize3d();var ctx=canvas.getContext("2d"),d=devicePixelRatio||1,w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle="#050c16";ctx.fillRect(0,0,w,h);var S=scene3d(),map=new Map(S.nodes.map(function(n){return[n.id,n]})),pp=new Map();S.nodes.forEach(function(n){pp.set(n.id,project(n,w,h))});S.edges.forEach(function(e){var a=pp.get(e.from),b=pp.get(e.to);if(!a||!b)return;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=e.type==="hard"?"#60a5fa":e.type==="fabric-suggests"?"#fbbf24":e.type==="external-service"?"#22d3ee":e.type==="detail"?"#34d399":"#a78bfa";ctx.globalAlpha=.55;ctx.lineWidth=2*d;ctx.stroke()});ctx.globalAlpha=1;S.nodes.slice().sort(function(a,b){return pp.get(a.id).z-pp.get(b.id).z}).forEach(function(n){var p=pp.get(n.id),r=Math.max(5,13*p.scale);ctx.beginPath();ctx.arc(p.x,p.y,r*d,0,Math.PI*2);ctx.fillStyle=n.id==="totem-core"?"#22d3ee":n.type==="external"?"#fbbf24":n.type==="category"?"#34d399":"#60a5fa";ctx.fill();ctx.font=(12*d)+"px system-ui";ctx.fillStyle="#dbeafe";ctx.fillText(short(n.label,24),p.x+r*d+6*d,p.y+4*d)})}
canvas.addEventListener("pointerdown",function(e){drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);canvas.classList.add("dragging")});canvas.addEventListener("pointermove",function(e){if(!drag||drag.id!==e.pointerId)return;cam.yaw+=(e.clientX-drag.x)*.008;cam.pitch=Math.max(-1.2,Math.min(1.2,cam.pitch+(e.clientY-drag.y)*.006));drag.x=e.clientX;drag.y=e.clientY;draw3d()});function end(e){if(!drag||drag.id!==e.pointerId)return;drag=null;canvas.classList.remove("dragging")}canvas.addEventListener("pointerup",end);canvas.addEventListener("pointercancel",end);canvas.addEventListener("wheel",function(e){e.preventDefault();cam.zoom=Math.max(.45,Math.min(2.5,cam.zoom*Math.exp(-e.deltaY*.001)));draw3d()},{passive:false});window.addEventListener("resize",function(){if(mode==="3d"){resize3d();draw3d()}});
renderOverview();
}());
</script>
</body>
